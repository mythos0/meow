<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="mx"></canvas>
<canvas id="sx"></canvas>
<script type="module">
// matrix.html — v3.18 robust skin probe. ONE page load renders every
// (breed × accessory × dir) combo plus every (state × breed) full-loadout
// vs plain pair, diffs each cell against its base IN-PAGE, and reports
// JSON. The node test asserts on the report; the canvases double as
// contact-sheet PNGs for eyeballing.
// Cell geometry: the standing cat spans ~180×165 at scale 1 (CAT_BBOX),
// so cells are 200×210 with the feet at y=CELL_H-30 — no cross-cell bleed.
import { drawCat, PALETTES, HATS, DRESSES, STATES } from '../src/cat-renderer.js';

const CELL_W = 200, CELL_H = 210, FEET_PAD = 30, LABEL_H = 14;
const breeds = Object.keys(PALETTES);           // grey_tabby, ginger_kitten, smokey_kitten
const accs = ['—', ...HATS, ...DRESSES];        // 1 + 7 + 4 = 12 columns
const dirs = [1, -1];
const cols = accs.length;

function paintChecker(g, w, h) {
  // MUST match cellStats' isBg palette exactly (#eceff4 / #e0e4ec)
  g.fillStyle = '#eceff4'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 16)
    for (let x = 0; x < w; x += 16)
      if ((x / 16 + y / 16) % 2 === 0) { g.fillStyle = '#e0e4ec'; g.fillRect(x, y, 16, 16); }
}

const errors = [];
function drawCell(g, ox, oy, opts) {
  g.save();
  g.translate(ox + CELL_W / 2, oy + CELL_H - FEET_PAD);
  try { drawCat(g, opts); }
  catch (e) { errors.push([opts.breed, opts.hat || '', opts.dress || '', opts.state].join('/') + ': ' + (e && e.message || e)); }
  g.restore();
}

// ---------------- accessories grid (mx) ----------------
// Labels live in a strip ABOVE each row (LABEL_H) so they never pollute
// the analyzed cell area.
const mx = document.getElementById('mx');
mx.width = cols * CELL_W;
mx.height = breeds.length * dirs.length * (CELL_H + LABEL_H);
const g = mx.getContext('2d');
paintChecker(g, mx.width, mx.height);

const cells = [];   // {breed, acc, dir, ox, oy}
let rowIdx = 0;
for (const dir of dirs) {
  for (const breed of breeds) {
    const oy = rowIdx * (CELL_H + LABEL_H) + LABEL_H;
    accs.forEach((acc, c) => {
      const ox = c * CELL_W;
      const opts = { t: 0.15, state: 'stand', breed, dir, scale: 1, jumpP: 0.5 };
      if (HATS.includes(acc)) opts.hat = acc;
      if (DRESSES.includes(acc)) opts.dress = acc;
      g.fillStyle = '#555'; g.font = '10px sans-serif';
      g.fillText((dir === 1 ? 'R ' : 'L ') + breed + (c === 0 ? '' : ' ' + acc), ox + 4, oy - 3);
      drawCell(g, ox, oy, opts);
      cells.push({ breed, acc, dir, ox, oy });
    });
    rowIdx++;
  }
}

// ---------------- states grid (sx): dressed | plain pairs ----------------
const HAT_FULL = 'tophat', DRESS_FULL = 'midnight';
const sx = document.getElementById('sx');
sx.width = STATES.length * 2 * CELL_W;
sx.height = breeds.length * (CELL_H + LABEL_H);
const g2 = sx.getContext('2d');
paintChecker(g2, sx.width, sx.height);

const stCells = [];
breeds.forEach((breed, i) => {
  const oy = i * (CELL_H + LABEL_H) + LABEL_H;
  STATES.forEach((st, c) => {
    for (const plain of [1, 0]) {          // dressed first, then its plain twin
      const ox = (c * 2 + (plain ? 1 : 0)) * CELL_W;
      const opts = { t: 0.3, state: st, breed, dir: 1, scale: 1, jumpP: 0.5 };
      if (!plain) { opts.hat = HAT_FULL; opts.dress = DRESS_FULL; }
      g2.fillStyle = '#555'; g2.font = '9px sans-serif';
      if (plain) g2.fillText(st, ox + 4, oy - 3);
      drawCell(g2, ox, oy, opts);
      stCells.push({ breed, st, plain, ox, oy });
    }
  });
});

// ---------------- in-page pixel analysis ----------------
function cellStats(ctx, ox, oy) {
  const d = ctx.getImageData(ox, oy, CELL_W, CELL_H).data;
  const isBg = (r, gr, b) =>
    (Math.abs(r - 0xec) < 10 && Math.abs(gr - 0xef) < 10 && Math.abs(b - 0xf4) < 10) ||
    (Math.abs(r - 0xe0) < 10 && Math.abs(gr - 0xe4) < 10 && Math.abs(b - 0xec) < 10);
  let opaque = 0, minY = 1e9, maxY = -1, minX = 1e9, maxX = -1;
  for (let y = 0; y < CELL_H; y++) for (let x = 0; x < CELL_W; x++) {
    const i = (y * CELL_W + x) * 4;
    if (d[i + 3] > 40 && !isBg(d[i], d[i + 1], d[i + 2])) {
      opaque++;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
    }
  }
  return { opaque, minY: minY === 1e9 ? -1 : minY, maxY, minX: minX === 1e9 ? -1 : minX, maxX, data: d };
}
function diffCount(a, b, y0 = 0, y1 = Infinity) {
  let n = 0;
  const yy0 = Math.max(0, y0), yy1 = Math.min(CELL_H, y1);
  for (let y = yy0; y < yy1; y++) for (let x = 0; x < CELL_W; x++) {
    const i = (y * CELL_W + x) * 4;
    if (Math.abs(a.data[i] - b.data[i]) > 8 || Math.abs(a.data[i + 1] - b.data[i + 1]) > 8 ||
        Math.abs(a.data[i + 2] - b.data[i + 2]) > 8 || Math.abs(a.data[i + 3] - b.data[i + 3]) > 8) n++;
  }
  return n;
}

const report = { cells: {}, states: {}, pairs: {}, errors, meta: { breeds, accs, states: STATES } };
for (const dir of dirs) {
  for (const breed of breeds) {
    const bc = cells.find(c => c.breed === breed && c.dir === dir && c.acc === '—');
    const base = cellStats(g, bc.ox, bc.oy);
    const key = (dir > 0 ? 'R' : 'L') + ':' + breed;
    report.cells[key] = { base: { opaque: base.opaque, minY: base.minY, maxY: base.maxY, minX: base.minX, maxX: base.maxX }, accs: {} };
    for (const acc of accs) {
      if (acc === '—') continue;
      const cell = cells.find(c => c.breed === breed && c.dir === dir && c.acc === acc);
      const st = cellStats(g, cell.ox, cell.oy);
      report.cells[key].accs[acc] = {
        opaque: st.opaque, minY: st.minY, minX: st.minX, maxX: st.maxX,
        diff: diffCount(base, st),
        topDiff: diffCount(base, st, 0, Math.floor(CELL_H * 0.45)),
        faceDiff: diffCount(base, st, Math.floor(CELL_H * 0.42), Math.floor(CELL_H * 0.65)),
        bodyDiff: diffCount(base, st, Math.floor(CELL_H * 0.45), Math.floor(CELL_H * 0.9)),
      };
    }
    for (let a = 0; a < HATS.length; a++) for (let b = a + 1; b < HATS.length; b++) {
      const ca = cells.find(c => c.breed === breed && c.dir === dir && c.acc === HATS[a]);
      const cb = cells.find(c => c.breed === breed && c.dir === dir && c.acc === HATS[b]);
      report.pairs[key + ':' + HATS[a] + '|' + HATS[b]] = diffCount(cellStats(g, ca.ox, ca.oy), cellStats(g, cb.ox, cb.oy));
    }
  }
}
for (const breed of breeds) {
  report.states[breed] = {};
  for (const st of STATES) {
    const dressed = stCells.find(c => c.breed === breed && c.st === st && !c.plain);
    const plain = stCells.find(c => c.breed === breed && c.st === st && c.plain);
    const ds = cellStats(g2, dressed.ox, dressed.oy);
    const ps = cellStats(g2, plain.ox, plain.oy);
    report.states[breed][st] = {
      opaqueDressed: ds.opaque, opaquePlain: ps.opaque,
      minYDressed: ds.minY, minYPlain: ps.minY,
      diff: diffCount(ps, ds),
      topDiff: diffCount(ps, ds, 0, Math.floor(CELL_H * 0.45)),
    };
  }
}
window.__report = report;
document.title = 'matrix-ready';
window.__ready = true;
</script>
</body>
</html>
