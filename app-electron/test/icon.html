<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body>
<!-- v3.1 icon: background-less front-facing cat face, procedurally drawn -->
<canvas id="cv" width="256" height="256" style="width:256px;height:256px"></canvas>
<script type="module">
const TAU = Math.PI * 2;

// warm orange tabby palette (matches the in-app breed)
const pal = {
  fur: '#eaa75f', dark: '#c47f3c', stripe: '#a85a24',
  earIn: '#e0a89e', nose: '#d07f6e', eye: '#93bb4e',
  pupil: '#241a10', tongue: '#d98a94',
};

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function radial(g, x, y, r0, r1, stops) {
  const gr = g.createRadialGradient(x, y, r0, x, y, r1);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  return gr;
}

export function drawFace(g, S) {
  // S = scale unit: 1 → full 256px canvas, 0.125 → 32px canvas
  g.clearRect(0, 0, 256 * S, 256 * S);
  g.save();
  g.translate(128 * S, 140 * S);
  g.scale(S, S);
  const r = 74;

  // ---- ears (behind skull)
  for (const s of [-1, 1]) {
    g.save();
    g.translate(s * r * 0.62, -r * 0.72);
    g.rotate(s * 0.30);
    g.beginPath();
    g.moveTo(-26, 18);
    g.quadraticCurveTo(-8, -58, 10, -52);
    g.quadraticCurveTo(30, -22, 26, 20);
    g.closePath();
    g.fillStyle = radial(g, -4, -20, 6, 56, [[0, shade(pal.fur, 0.14)], [1, shade(pal.fur, -0.24)]]);
    g.fill();
    g.beginPath();
    g.moveTo(-13, 10);
    g.quadraticCurveTo(-4, -34, 4, -31);
    g.quadraticCurveTo(16, -12, 14, 12);
    g.closePath();
    g.fillStyle = pal.earIn;
    g.fill();
    g.restore();
  }

  // ---- head
  g.beginPath();
  g.ellipse(0, 0, r, r * 0.92, 0, 0, TAU);
  g.fillStyle = radial(g, -r * 0.28, -r * 0.34, r * 0.12, r * 1.4, [
    [0, shade(pal.fur, 0.30)], [0.55, pal.fur], [1, shade(pal.fur, -0.26)],
  ]);
  g.fill();

  // cheek fluff
  g.fillStyle = pal.fur;
  for (const [cx, cy, rx, ry, rot] of [
    [-r * 0.94, r * 0.18, 15, 10, -0.5], [-r * 0.88, r * 0.42, 14, 9, -0.9],
    [r * 0.94, r * 0.18, 15, 10, 0.5], [r * 0.88, r * 0.42, 14, 9, 0.9],
  ]) {
    g.beginPath(); g.ellipse(cx, cy, rx, ry, rot, 0, TAU); g.fill();
  }

  // forehead tabby stripes
  g.strokeStyle = pal.stripe;
  g.globalAlpha = 0.55;
  g.lineWidth = 7; g.lineCap = 'round';
  for (const dx of [-22, 0, 22]) {
    g.beginPath();
    g.moveTo(dx - 8, -r * 0.78);
    g.quadraticCurveTo(dx, -r * 0.52, dx + (dx === 0 ? 0 : dx > 0 ? 7 : -7), -r * 0.46);
    g.stroke();
  }
  g.globalAlpha = 1;

  // muzzle
  g.beginPath();
  g.ellipse(0, r * 0.38, r * 0.56, r * 0.40, 0, 0, TAU);
  g.fillStyle = 'rgba(255,244,228,0.85)';
  g.fill();

  // ---- eyes
  for (const s of [-1, 1]) {
    const ex = s * r * 0.40, ey = -r * 0.12;
    g.beginPath(); g.ellipse(ex, ey, 17, 14.5, 0, 0, TAU);
    g.fillStyle = '#f8f6f2'; g.fill();
    g.beginPath(); g.ellipse(ex + s * 1.5, ey, 12.5, 12.8, 0, 0, TAU);
    g.fillStyle = radial(g, ex - 2, ey - 4, 1, 15, [
      [0, shade(pal.eye, 0.4)], [0.7, pal.eye], [1, shade(pal.eye, -0.45)],
    ]);
    g.fill();
    // vertical pupil
    g.beginPath(); g.ellipse(ex + s * 1.5, ey, 4.6, 9.6, 0, 0, TAU);
    g.fillStyle = pal.pupil; g.fill();
    // catchlights
    g.beginPath(); g.ellipse(ex + s * 1.5 - 4, ey - 4.6, 2.6, 2.2, 0.4, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.95)'; g.fill();
    g.beginPath(); g.ellipse(ex + s * 1.5 + 4, ey + 5, 1.4, 1.2, 0, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.6)'; g.fill();
  }

  // ---- nose
  g.beginPath();
  g.moveTo(-9, r * 0.22);
  g.lineTo(9, r * 0.22);
  g.quadraticCurveTo(5, r * 0.22 + 10, 0, r * 0.22 + 11);
  g.quadraticCurveTo(-5, r * 0.22 + 10, -9, r * 0.22);
  g.closePath();
  g.fillStyle = radial(g, 0, r * 0.22 + 3, 1, 11, [[0, shade(pal.nose, 0.3)], [1, shade(pal.nose, -0.15)]]);
  g.fill();

  // ---- mouth (ω)
  g.strokeStyle = shade(pal.fur, -0.45);
  g.lineWidth = 3.4; g.lineCap = 'round';
  const my = r * 0.22 + 11;
  g.beginPath();
  g.moveTo(0, my);
  g.quadraticCurveTo(-5, my + 11, -14, my + 6);
  g.moveTo(0, my);
  g.quadraticCurveTo(5, my + 11, 14, my + 6);
  g.stroke();

  // whiskers
  g.strokeStyle = 'rgba(255,255,255,0.9)';
  g.lineWidth = 2.4;
  for (let i = 0; i < 3; i++) {
    const wy = r * 0.28 + i * 9;
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(s * r * 0.30, wy);
      g.quadraticCurveTo(s * r * 0.72, wy - 4 + i, s * r * 1.22, wy - 8 + i * 3);
      g.stroke();
    }
  }

  // rim light
  g.strokeStyle = 'rgba(255,255,255,0.30)';
  g.lineWidth = 5;
  g.beginPath();
  g.ellipse(0, 0, r - 3, r * 0.92 - 3, 0, -Math.PI * 0.86, -Math.PI * 0.14);
  g.stroke();

  g.restore();
}
window.__drawFace = drawFace;
const cv = document.getElementById('cv');
const g = cv.getContext('2d');
drawFace(g, 1);
document.title = 'icon-ready';
window.__ready = true;
</script>
</body>
</html>
