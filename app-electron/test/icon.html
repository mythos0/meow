<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body>
<canvas id="cv" width="256" height="256" style="width:256px;height:256px"></canvas>
<script type="module">
import { drawCat, drawParticles } from '../src/cat-renderer.js';
const cv = document.getElementById('cv');
const g = cv.getContext('2d');
g.save();
g.translate(128, 236);
g.scale(1.7, 1.7);
// cute sitting pose for the icon
drawCat(g, { t: 0.15, state: 'sit', breed: 'orange_tabby', dir: 1, scale: 1 });
drawParticles(g, { t: 0.15, state: 'sit', breed: 'orange_tabby', scale: 1 });
g.restore();
document.title = 'x';
window.__ready = true;
</script>
</body>
</html>
