<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #cv{display:block;}
  #grid{display:block;}
</style>
</head>
<body>
<canvas id="cv" width="360" height="260"></canvas>
<canvas id="grid" width="0" height="0" style="display:none"></canvas>
<script type="module">
import { drawCat, drawParticles, drawEmote, drawLaser, drawButterfly, emoteAnchor, STATES, PALETTES, EMOTES } from '../src/cat-renderer.js';

// Mode 1: single render — ?state=walk&t=0.3&breed=grey_tabby&dir=1&scale=1[&emote=heart]
// Mode 2: contact sheet — ?sheet=1 (all states x timestamps + breed rows + emote row)
const q = new URLSearchParams(location.search);
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

if (q.get('sheet')) {
  const states = STATES;
  const breeds = Object.keys(PALETTES);
  const times = [0.0, 0.35];
  const CELL_W = 240, CELL_H = 200;
  const cols = 5;
  const stateCells = states.length * times.length;
  const rows = Math.ceil(stateCells / cols);
  const breedRows = Math.ceil(breeds.length / cols);
  const emoteCells = EMOTES.length;
  const emoteRows = Math.ceil(emoteCells / cols);
  const toyRows = 1;   // v3.5: laser dot, butterfly, chase vignette
  const grid = document.getElementById('grid');
  grid.style.display = 'block';
  grid.width = cols * CELL_W;
  grid.height = (rows + breedRows + emoteRows + toyRows) * CELL_H;
  const g = grid.getContext('2d');
  g.fillStyle = '#e8e8f0'; g.fillRect(0,0,grid.width,grid.height);
  for (let y = 0; y < grid.height; y += 20)
    for (let x = 0; x < grid.width; x += 20)
      if ((x/20 + y/20) % 2 === 0) { g.fillStyle = '#dcdce6'; g.fillRect(x, y, 20, 20); }

  let idx = 0;
  g.font = '13px sans-serif'; g.fillStyle = '#333';
  for (const st of states) for (const tt of times) {
    const col = idx % cols, row = Math.floor(idx / cols);
    const ox = col * CELL_W, oy = row * CELL_H;
    g.strokeStyle = '#bbb'; g.strokeRect(ox, oy, CELL_W, CELL_H);
    g.fillStyle = '#333'; g.fillText(st + ' t=' + tt, ox + 6, oy + 16);
    g.save();
    g.translate(ox + CELL_W/2, oy + CELL_H - 34);
    const opts = { t: tt, state: st, breed: 'grey_tabby', dir: 1, scale: 1, jumpP: 0.5 };
    drawCat(g, opts);
    drawParticles(g, opts);
    g.restore();
    idx++;
  }
  breeds.forEach((br, i) => {
    const col = i % cols, row = rows + Math.floor(i / cols);
    const ox = col * CELL_W, oy = row * CELL_H;
    g.strokeStyle = '#bbb'; g.strokeRect(ox, oy, CELL_W, CELL_H);
    g.fillStyle = '#333'; g.fillText(br, ox + 6, oy + 16);
    g.save();
    g.translate(ox + CELL_W/2, oy + CELL_H - 34);
    drawCat(g, { t: 0.15, state: 'walk', breed: br, dir: 1, scale: 1 });
    g.restore();
  });
  EMOTES.forEach((em, i) => {
    const col = i % cols, row = rows + breedRows + Math.floor(i / cols);
    const ox = col * CELL_W, oy = row * CELL_H;
    g.strokeStyle = '#bbb'; g.strokeRect(ox, oy, CELL_W, CELL_H);
    g.fillStyle = '#333'; g.fillText('emote:' + em, ox + 6, oy + 16);
    g.save();
    g.translate(ox + CELL_W/2, oy + CELL_H - 34);
    drawCat(g, { t: 0.15, state: 'sit', breed: 'grey_tabby', dir: 1, scale: 1 });
    drawEmote(g, { kind: em, t: 0.5, x: 46, y: -150, scale: 1 });
    g.restore();
  });

  // v3.5 funny pack toys
  const toyRow = rows + breedRows + emoteRows;
  const toys = [
    ['toy: laser dot', (gg) => drawLaser(gg, { t: 0.4, scale: 1, r: 8 })],
    ['toy: butterfly', (gg) => drawButterfly(gg, { t: 0.4, scale: 2.2, hue: 28 })],
    ['toy: laser chase', (gg) => {
      drawCat(gg, { t: 0.2, state: 'laser', breed: 'grey_tabby', dir: 1, scale: 1 });
      gg.save(); gg.translate(96, -30); drawLaser(gg, { t: 0.4, scale: 1 }); gg.restore();
    }],
    ['toy: butterfly hunt', (gg) => {
      drawCat(gg, { t: 0.6, state: 'pounce', breed: 'grey_tabby', dir: 1, scale: 1 });
      gg.save(); gg.translate(86, -110); drawButterfly(gg, { t: 0.3, scale: 1.8, hue: 200 }); gg.restore();
    }],
  ];
  toys.forEach(([label, draw], i) => {
    const ox = i * CELL_W, oy = toyRow * CELL_H;
    g.strokeStyle = '#bbb'; g.strokeRect(ox, oy, CELL_W, CELL_H);
    g.fillStyle = '#333'; g.fillText(label, ox + 6, oy + 16);
    g.save();
    g.translate(ox + CELL_W/2, oy + CELL_H - 34);
    draw(g);
    g.restore();
  });

  document.title = 'sheet-ready';
} else {
  const state = q.get('state') || 'walk';
  const t = parseFloat(q.get('t') || '0');
  const breed = q.get('breed') || 'grey_tabby';
  const dir = parseInt(q.get('dir') || '1');
  const scale = parseFloat(q.get('scale') || '1');
  const jumpP = parseFloat(q.get('jumpP') || '0.5');
  const emote = q.get('emote');
  const hat = q.get('hat');        // v3.18: store hats render in the harness
  const dress = q.get('dress');    // v3.18: store dresses render in the harness
  const jacket = q.get('jacket');  // v3.21: store winter jackets render in the harness
  const stateT = parseFloat(q.get('st' ) || q.get('stT') || q.get('stateT') || String(t));   // v3.16: pose-internal state time (the dance phases)
  const W = cv.width, H = cv.height;
  if (q.get('bg') !== 'alpha') {           // v3.18: transparent mode for bbox tests
    ctx.fillStyle = '#eceff4'; ctx.fillRect(0,0,W,H);
    for (let y = 0; y < H; y += 16)
      for (let x = 0; x < W; x += 16)
        if ((x/16 + y/16) % 2 === 0) { ctx.fillStyle = '#e0e4ec'; ctx.fillRect(x, y, 16, 16); }
  }
  ctx.save();
  ctx.translate(W/2, H - 40);
  const opts = { t, state, breed, dir, scale, jumpP, stateT, hat, dress, jacket };
  drawCat(ctx, opts);
  drawParticles(ctx, opts);
  if (emote) {
    const A = emoteAnchor(q.get('breed') || 'grey_tabby');
    drawEmote(ctx, { kind: emote, t: parseFloat(q.get('emoteT') || '0.5'), x: A.x, y: A.y, scale: 1 });
  }
  ctx.restore();
  document.title = 'single-ready:' + state;
}
window.__ready = true;
</script>
</body>
</html>
