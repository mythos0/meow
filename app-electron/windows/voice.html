<!doctype html>
<!-- v3.16 PRIMARY VOICE ENGINE — Chromium's Web Speech API.

     v3.15 shipped only the offline SAPI PowerShell listener, and on real
     user machines it failed in silence (no en-US recognizer → the grammar
     never loaded, but the error was swallowed; weak with accents; mic
     privacy quirks undetectable). This hidden always-alive window runs
     webkitSpeechRecognition instead: Google-quality recognition that
     handles accented English ("ghum kariya nilo sokhi" spoken aloud) far
     better, works on every OS, and REPORTS its problems ('audio-capture',
     'not-allowed', 'network', 'service-not-allowed') so the Settings page
     can say exactly what is wrong instead of pretending to listen.

     Lifecycle: main.js creates this window (hidden, no taskbar) when voice
     commands are enabled and calls __voiceStart() / __voiceStop() over
     executeJavaScript. Phrases flow to the main process through the
     preload bridge (voice:engine-event). Chromium ends continuous
     recognition every ~60s or on silence — onend restarts it with a
     capped backoff forever. Fatal errors flip main.js to the SAPI
     fallback engine. -->
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
  <title>meow-voice-engine</title>
</head>
<body style="background:transparent;margin:0">
<script>
'use strict';
(function () {
  const send = ev => { try { window.meow.voiceEngineEvent(ev); } catch { } };

  let rec = null;
  let wanted = false;
  let timer = null;
  let restarts = 0;
  let netStrikes = 0;
  let announced = false;

  function scheduleRestart(ms) {
    if (!wanted) return;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; tryListen(); }, ms);
  }

  function tryListen() {
    if (!wanted) return;
    if (!window.webkitSpeechRecognition) {
      send({ type: 'unavailable', reason: 'no-web-speech' });
      return;
    }
    try {
      rec = new webkitSpeechRecognition();
      rec.continuous = true;
      rec.interimResults = false;
      rec.lang = 'en-US';
      rec.maxAlternatives = 1;
      rec.onstart = () => {
        if (announced) return;
        announced = true;
        send({ type: 'listening' });
      };
      rec.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (!r || !r.isFinal) continue;
          const text = String((r[0] && r[0].transcript) || '').trim();
          const c = r[0] && typeof r[0].confidence === 'number' ? r[0].confidence : 0.85;
          if (text) send({ type: 'phrase', text: text.slice(0, 200), confidence: c });
        }
      };
      rec.onerror = e => {
        const err = String((e && e.error) || 'unknown');
        if (err === 'no-speech') return;               // plain silence — onend restarts
        if (err === 'aborted') return;                 // we stopped it ourselves
        if (err === 'network') {
          netStrikes++;
          if (netStrikes < 3) { send({ type: 'net-retry', strikes: netStrikes }); return; }
          send({ type: 'error', error: 'network' });   // persistent offline → main flips to SAPI
          return;
        }
        send({ type: 'error', error: err });
      };
      rec.onend = () => {
        rec = null;
        if (!wanted) return;
        restarts++;
        scheduleRestart(Math.min(6000, 500 + restarts * 250));
      };
      rec.start();
    } catch (err) {
      send({ type: 'unavailable', reason: String((err && err.message) || err) });
    }
  }

  window.__voiceStart = function () {
    if (wanted) return;
    wanted = true;
    netStrikes = 0;
    restarts = 0;
    announced = false;
    send({ type: 'starting' });
    tryListen();
  };
  window.__voiceStop = function () {
    wanted = false;
    clearTimeout(timer);
    timer = null;
    try { if (rec) rec.abort(); } catch { }
    rec = null;
    send({ type: 'stopped' });
  };
  window.__voiceState = function () {
    return { wanted, listening: !!(rec && announced), restarts, netStrikes };
  };

  send({ type: 'booted' });
})();
</script>
</body>
</html>
