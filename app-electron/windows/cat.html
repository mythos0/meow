<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MeowCat</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  #cv { position: fixed; inset: 0; }
  #bubble, #badge {
    position: fixed; display: none; max-width: 260px;
    background: rgba(22,24,30,0.92); color: #ffe9c8; border: 1px solid #3a3f4b;
    border-radius: 14px; padding: 10px 14px; font: 14px/1.4 system-ui, sans-serif;
    box-shadow: 0 6px 24px rgba(0,0,0,.4); z-index: 10;
  }
  #bubble:after {
    content: ''; position: absolute; left: 24px; bottom: -8px;
    border: 8px solid transparent; border-top-color: #3a3f4b; border-bottom: 0;
  }
  #badge { padding: 4px 10px; font: 600 12px/1.5 system-ui, sans-serif; border-radius: 10px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bubble"></div>
<div id="badge"></div>
<script type="module">
import { drawCat, drawParticles, drawEmote, drawLaser, drawButterfly, emoteAnchor, CAT_BBOX, registerSkin } from '../src/cat-renderer.js';
import { CatBrain } from '../src/cat-brain.js';
import { computeRegionSize, initialOrigin, slideIfNeeded, companionLeash, chaseStep, clampOrigin, CHASE_V, DRAG_CHASE_V, dragChaseTarget, dragWindowTarget, laneHopTarget, unionWorkAreas } from '../src/region.js';
import { batteryCrisis } from '../src/system-reactions.js';
import { unlockedPerks } from '../src/achievements.js';
import { zonesToScreen } from '../src/no-walk.js';
import { spawnButterfly as bflySpawn, tickButterfly as bflyTick, butterflyCatchable, startleButterfly, swatCatchable, dodgeButterfly, HUNT_RADIUS as BFLY_HUNT_RADIUS } from '../src/butterfly.js';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: true });
const bubble = document.getElementById('bubble');
const badge = document.getElementById('badge');

let S = { breed: 'grey_tabby', size: 1.0, opacity: 1.0, sounds: true, speed: 55, workArea: null };
let brain = null;
let audio = {};
let bubbleTimer = null;
// v3.10: the call-time volume duck multiplier was removed along with call
// detection — the cat ignores calls completely and always plays at full
// requested volume.
let frozen = false;           // v3.6: photo mode
let flashUntil = 0;           // v3.6: photo flash
let currentHat = null;        // v3.6: seasonal / skin hat
// v3.5 toys — v3.13: the butterfly is a pure state machine (src/butterfly.js)
// that always spawns relative to the CURRENT lane, so it shows on EVERY
// display, and the cat hunts it like a real cat (stalk → pounce → catch).
let laser = null;
let butterfly = null;
let butterflyTimer = null;
let bflyAttempts = 0;         // pounces the current butterfly has endured
let bflyHuntCd = 0;           // seconds until a new hunt may start
let bflyCaughtPending = false;// a caught butterfly awaiting the pounce-landing reward
let bflyPin = null;           // v3.14 e2e seam: pin the butterfly at a fixed point
let prevState = null;
// v3.6 companion + party
let companion = null;         // { brain, breed }
let companionCd = 8;
let partyCats = null;         // [{brain, breed, alpha}] screensaver dance party
let partyUntil = 0;
let stalkWasCursor = false;
let lastCursor = null;
let pomoState = null;         // {mode, remaining, ...}
// v3.6 battery: prefer main-process samples (sysfs/Win32_Battery), fall back
// to navigator.getBattery; test hooks can inject too.
let battery = null;
// v3.6 perks (from achievements) — v3.6.1: actually computed from S.unlocked
let perks = { rainbowPet: false, sparkleLand: false, heartRain: false, dotSlayer: false };
// v3.3 region window state
let O = { x: 0, y: 0 };
let REGION = { w: 480, h: 434 };

// ---------------------------------------------------------- audio
function loadSounds() {
  // v3.8: growl_real + hiss_real finally load — hairball/build-bad growls
  // were silent no-ops before (play() found no element and gave up).
  const names = ['meow_real', 'meow_real2', 'meow_real3', 'meow_single', 'purr_real', 'purr', 'patter', 'run_patter', 'whoosh', 'land', 'scratch', 'coin', 'chirp', 'dance_loop', 'glass_real', 'squeak', 'growl_real', 'hiss_real'];
  for (const n of names) {
    const a = new Audio(`../sounds/${n}.wav`);
    a.preload = 'auto';
    audio[n] = a;
  }
}
// v3.7: pooled clones — the old code allocated a fresh HTMLAudioElement via
// cloneNode() for EVERY play call (footsteps fire up to ~14/s while walking),
// which was constant GC churn in the renderer. A small rotating pool per
// sound reuses elements; overlapping same-name plays may restart a tail,
// which is inaudible for the short UI/footstep samples.
const audioPool = new Map();
function play(name, vol = 0.9) {
  if (!S.sounds || !audio[name]) return;
  try {
    let pool = audioPool.get(name);
    if (!pool) {
      pool = { arr: [audio[name].cloneNode(), audio[name].cloneNode(), audio[name].cloneNode()], i: 0 };
      audioPool.set(name, pool);
    }
    const a = pool.arr[pool.i++ % pool.arr.length];
    a.volume = Math.max(0, Math.min(1, vol));
    try { a.currentTime = 0; } catch {}
    a.play().catch(() => {});
    window.__lastPlay = { name, t: performance.now() / 1000 };   // e2e instrumentation
  } catch {}
}

// v3.12 SOUND ARCHITECTURE — three independent voices, ZERO cancellation.
// The old design played random/ambient meows through the SAME exclusive
// element as the classic voice and switched its src mid-playback: every new
// meow aborted the previous one ("the double click sound tries to play and
// cancels 2-3 times, and then playing — it is messy"). Now:
//   · CLICK voice        — the natural single meow, dedicated element
//   · DOUBLE-CLICK voice — the classic variants, one element per variant
//   · AMBIENT voice      — a 3-slot rotating pool of natural meows
// Mutual exclusion (user rule): while a click/double-click meow is sounding,
// ambient meows are SKIPPED — never stacked, never cut. A user click first
// silences the ambient voice, so the two can never fight.
const CLICK_KEY = 'meow_single';
const DBL_KEYS = ['meow_real', 'meow_real2', 'meow_real3'];
let voiceClick = null;
let voiceDbl = [];          // one element per classic variant
let ambientPool = [];       // 3 rotating natural-meow clones
let ambientIdx = 0;
const activeVoices = new Set();   // every voice element currently audible

function buildVoices() {
  voiceClick = audio[CLICK_KEY] ? audio[CLICK_KEY].cloneNode() : null;
  voiceDbl = DBL_KEYS.filter(k => audio[k]).map(k => audio[k].cloneNode());
  ambientPool = voiceClick ? [voiceClick.cloneNode(), voiceClick.cloneNode(), voiceClick.cloneNode()] : [];
  for (const el of [voiceClick, ...voiceDbl, ...ambientPool].filter(Boolean)) {
    el.preload = 'auto';
    el.addEventListener('play', () => activeVoices.add(el));
    el.addEventListener('ended', () => activeVoices.delete(el));
    el.addEventListener('pause', () => { if (el.ended || (el.currentTime || 0) <= 0.01) activeVoices.delete(el); });
  }
  window.__meowEls = activeVoices;   // e2e instrumentation (kept from v3.8)
}

const elPlaying = el => !!el && !el.paused && !el.ended;
// a USER meow (click / double-click) is sounding right now
function meowBusy() { return elPlaying(voiceClick) || voiceDbl.some(elPlaying); }

function stopAmbient() { for (const el of ambientPool) { try { el.pause(); } catch {} } }

// v3.11 kept: ONE natural single meow per quick tap (meow_single.wav).
// v3.12: dedicated element + its own toggle + it stops ambient meows first.
function playMeowSingle(vol = 0.95) {
  if (!S.sounds || !S.soundClickMeow || !voiceClick) return;
  try {
    stopAmbient();
    voiceClick.volume = Math.max(0, Math.min(1, vol));
    try { voiceClick.currentTime = 0; } catch {}
    voiceClick.play().catch(() => {});
    window.__lastPlay = { name: 'meow_single', t: performance.now() / 1000, exclusive: 'meow' };
  } catch {}
}
function stopMeowSingle() {
  try { if (voiceClick) { voiceClick.pause(); try { voiceClick.currentTime = 0; } catch {} } } catch {}
}

// The DOUBLE-CLICK voice — the classic v3.8 variant rotation, kept exactly
// as it sounded (user request), now with dedicated elements: rapid restarts
// replace each other cleanly instead of aborting a pending src load.
function playMeow(vol = 0.95) {
  if (!S.sounds || !S.soundDblClickMeow || !voiceDbl.length) return;
  try {
    stopMeowSingle();
    stopAmbient();
    const idx = Math.floor(Math.random() * voiceDbl.length);
    const el = voiceDbl[idx];
    for (const other of voiceDbl) if (other !== el) { try { other.pause(); } catch {} }
    el.volume = Math.max(0, Math.min(1, vol));
    try { el.currentTime = 0; } catch {}
    el.play().catch(() => {});
    window.__lastPlay = { name: DBL_KEYS[idx], t: performance.now() / 1000, exclusive: 'meow' };
  } catch {}
}

// AMBIENT voice — one natural meow from the rotating pool. A note never
// cancels another (no src switching, no shared element), which is what made
// random meows sound broken before.
function ambientNote(vol = 0.75) {
  if (!ambientPool.length) return;
  const el = ambientPool[ambientIdx++ % ambientPool.length];
  try {
    el.volume = Math.max(0, Math.min(1, vol));
    try { el.currentTime = 0; } catch {}
    el.play().catch(() => {});
    window.__lastPlay = { name: 'meow_single', t: performance.now() / 1000, exclusive: 'ambient' };
  } catch {}
}

// v3.11 kept: AMBIENT MEOWS at random times — usually one natural meow,
// occasionally (30%) a burst of 2–4. v3.12: every note is SKIPPED (not cut)
// while a user meow is sounding, so random meows can never trample the
// click voice or spam cancel/start cycles.
let ambientMeowTimer = null;
function scheduleAmbientMeow() {
  clearTimeout(ambientMeowTimer);
  ambientMeowTimer = setTimeout(fireAmbientMeow, 22000 + Math.random() * 33000);   // every 22–55s
  if (typeof ambientMeowTimer.unref === 'function') ambientMeowTimer.unref();
}
function fireAmbientMeow() {
  try {
    if (S.sounds && S.randomMeows && brain && !frozen && !['sleep', 'curl'].includes(brain.state) && !meowBusy()) {
      if (Math.random() < 0.3) {
        // continuous meowing: a short burst at random spacing
        const n = 2 + Math.floor(Math.random() * 3);   // 2–4
        let t = 0;
        for (let i = 0; i < n; i++) {
          setTimeout(() => { if (S.sounds && S.randomMeows && !meowBusy()) ambientNote(0.8); }, t);
          t += 340 + Math.random() * 320;
        }
      } else {
        ambientNote(0.7);
      }
      if (Math.random() < 0.5) brain.emote = { kind: 'note', t0: brain.t };
    }
  } catch { /* never die on ambience */ }
  scheduleAmbientMeow();
}

// ---------------------------------------------------------- init
// v3.11: the rect the cat ROAMS — bounding-box union of every display's work
// area (multi-monitor). Single-display machines get the classic behavior.
function roamBounds(s) {
  if (Array.isArray(s.workAreas) && s.workAreas.length) return unionWorkAreas(s.workAreas);
  return s.workArea || { x: 0, y: 0, width: screen.width, height: screen.height };
}
function primaryBounds(s) {
  return s.workArea || { x: 0, y: 0, width: screen.width, height: screen.height };
}
async function init() {
  loadSounds();
  buildVoices();   // v3.12: the three independent meow voices
  S = { ...S, ...await window.meow.getSettings() };
  registerCustomSkins(S.customSkins);
  const wa = primaryBounds(S);
  const roam = roamBounds(S);
  brain = new CatBrain({
    bounds: { x: roam.x, y: roam.y, w: roam.width, h: roam.height },
    groundY: wa.y + wa.height - 8,
    speed: S.speed,
    breed: S.breed,
  });
  brain.setScale(S.size);
  brain.setEventHandler(onBrainEvent);   // v3.14: real registration (the old brain.onEvent(fn) call was a silent no-op)
  syncRegion();
  scheduleAmbientMeow();   // v3.11: the cat meows on its own at random times
  window.meow.on('settings-changed', applySettings);
  window.meow.on('do-action', doAction);
  window.meow.on('reminder-fired', showReminder);
  window.meow.on('laser-start', () => {
    // a user-fired laser overrides any butterfly hunt in progress
    if (butterfly && butterfly.state === 'hunted') butterfly.state = 'cruise';
    spawnLaser();
  });
  // v3.13: the companion kitten gets the SAME window-top list as the main
  // cat — without it the kitten could never follow the big cat up, and the
  // chase camera (which frames the MAIN cat's feet) pushed the ground-level
  // kitten below the canvas: "the companion cat is not showing".
  window.meow.on('platforms', list => {
    if (brain) brain.setPlatforms(list);
    if (companion) companion.brain.setPlatforms(list);
  });
  // v3.9: live platform tracking — main polls the tracked window's rect at
  // ~3Hz (one persistent PowerShell, P/Invoke GetWindowRect) so the cat RIDES
  // a dragged/resized window in real time instead of floating for up to a
  // scan interval and then snapping (the other half of the "rendering jump").
  window.meow.on('platform-rect', r => { if (brain) brain.updateTrackedPlatform(r); });
  // ---------------- v3.6 living-on-your-machine channels ----------------
  window.meow.on('system-event', onSystemEvent);
  window.meow.on('music', onMusic);
  window.meow.on('typing', onTyping);
  window.meow.on('cursor-idle', onCursorIdle);
  window.meow.on('cursor-busy', onCursorBusy);
  window.meow.on('new-window', onNewWindow);
  window.meow.on('app-focus', onAppFocus);
  window.meow.on('pomodoro', onPomodoro);
  window.meow.on('achievement', showAchievement);
  window.meow.on('no-walk-zones', zones => {
    if (!brain) return;
    if (S.noWalkZones === false) { brain.setNoWalkZones([]); return; }   // v3.6.1: respect the toggle at boot
    brain.setNoWalkZones(zonesToScreen(zones, brain.bounds));
  });
  window.meow.on('photo-mode', () => photoMode());
  window.meow.on('dance-party', startDanceParty);
  window.meow.on('time-bias', mode => { if (!S.timeOfDayMood) return; brain?.setTimeBias(mode); });
  window.meow.on('boot-greet', () => brain?.greet());
  window.meow.on('workarea-changed', async () => {
    const s2 = await window.meow.getSettings();
    S = { ...S, ...s2 };
    const wa2 = primaryBounds(S);
    const roam2 = roamBounds(S);
    brain.bounds = { x: roam2.x, y: roam2.y, w: roam2.width, h: roam2.height };
    brain.groundY = wa2.y + wa2.height - 8;
    if (companion) { companion.brain.bounds = { ...brain.bounds }; companion.brain.groundY = brain.groundY; }
    syncRegion();
  });
  applyHat();
  applyCompanion(S.companionCat);
  applyTimeBias();
  refreshPerks();
  setInterval(applyTimeBias, 60_000);
  pollBattery();
  scheduleButterfly();
  // v3.7: stop painting entirely while the cat is hidden — and since v3.10 the
  // ONLY thing that can hide it is an explicit user action (tray / Ctrl+Alt+C).
  // The loop used to burn 60fps of software-raster CPU on an invisible window.
  window.meow.on('cat-visible', on => {
    catVisible = !!on;
    if (catVisible) { lastTs = performance.now(); rafId = requestAnimationFrame(loop); }
    else cancelAnimationFrame(rafId);
  });
  // v3.12: liveness watchdog — answer main's ping with the paint counter +
  // state so main can reload a hung/blank overlay instead of showing the user
  // a silently vanished cat.
  window.meow.on('heartbeat', () => {
    try {
      window.meow.heartbeatPong({
        paintCount: window.__paintCount || 0,
        state: brain ? brain.state : 'boot',
        visible: catVisible,
        t: Date.now(),
      });
    } catch { /* never die on the watchdog */ }
  });
  if (S.timeOfDayMood) brain.setTimeBias((new Date().getHours() >= 22 || new Date().getHours() < 7) ? 'night' : 'day');
  rafId = requestAnimationFrame(loop);
}

function registerCustomSkins(list) {
  for (const sk of list || []) {
    const r = registerSkin(sk.def, sk.id);
    if (r.ok && S.breed === 'custom:' + sk.id) applyHat();
  }
}

function onBrainEvent(ev, data) {
  // v3.14: the rearing swat — each apex is resolved here (catch vs dodge)
  if (ev === 'rear:swat') resolveButterflySwat(data);
  else if (ev === 'butterfly:rear') sfx('chirp', 0.35);   // the excited leap-up
}

// v3.14: renderer-side execution log — real brain/hunt/drag events stream
// into main's ring buffer and appear live in the hidden terminal
function xlog(tag, msg, data) {
  try { window.meow.execLogPush({ src: 'cat', tag, msg, data, ts: Date.now() }); } catch { /* bridge gone */ }
}

// ---------------------------------------------------------- hats / skins
function applyHat() {
  let hat = null;
  if (S.seasonalSkins && S.season) hat = S.season;
  const sk = (S.customSkins || []).find(s => 'custom:' + s.id === S.breed);
  if (!hat && sk && sk.def && sk.def.hat) hat = sk.def.hat;   // skin's own hat
  currentHat = hat;
  if (companion) companion.hat = hat;
}

// ---------------------------------------------------------- time of day
function applyTimeBias() {
  if (!brain) return;
  if (!S.timeOfDayMood) { brain.setTimeBias('day'); return; }
  const h = new Date().getHours();
  brain.setTimeBias((h >= 22 || h < 7) ? 'night' : 'day');
}

// ---------------------------------------------------------- battery
async function pollBattery() {
  try {
    if (navigator.getBattery && (!battery || battery.source !== 'test')) {
      const b = await navigator.getBattery();
      if (b) {
        // v3.6.1: read fresh values every poll (the old code snapshotted once,
        // so unplugging the charger was never noticed). Never clobber an
        // injected/test value.
        if (!battery || battery.source !== 'nav') battery = { level: b.level, charging: b.charging, source: 'nav' };
        else { battery.level = b.level; battery.charging = b.charging; }
      }
    }
  } catch { /* no battery API — desktop PC */ }
  applyBatteryCrisis();
  setTimeout(pollBattery, 45_000);
}

// ---------------------------------------------------------- v3.6 events
function onSystemEvent(ev) {
  if (!brain) return;
  if (ev.type === 'stress') {
    brain.setStress(true, 12_000);
    brain.emote = { kind: 'exclaim', t0: brain.t };
  } else if (ev.type === 'build-ok') {
    brain.celebrate();
    sfx('chirp', 0.6);
    showBubble('✅ build green — the cat approves', 3600);
  } else if (ev.type === 'build-bad') {
    brain.mopeNow();
    sfx('growl_real', 0.18);
    showBubble('❌ build red — the cat is not amused', 3600);
  } else if (ev.type === 'battery') {
    // v3.6.1: real battery samples from main (sysfs / Win32_Battery)
    battery = { level: ev.level, charging: ev.charging };
    applyBatteryCrisis();
  }
}

// central battery reaction — used by both main pushes and the navigator poll
function applyBatteryCrisis() {
  if (!brain || !battery) return;
  if (!S.reactLowBattery) {
    if (brain.state === 'curl' && brain._batteryLow) { brain.setBatteryLow(false); brain.emote = { kind: 'star', t0: brain.t }; }
    return;
  }
  const crisis = batteryCrisis(battery.level, battery.charging);
  if (crisis && !brain._batteryLow) {
    brain.curlUp();
    brain.emote = { kind: 'battery', t0: brain.t };
    showBubble('🔋 Low battery — saving energy with you', 4000);
  } else if (!crisis && brain._batteryLow) {
    brain.setBatteryLow(false);
    brain.emote = { kind: 'star', t0: brain.t };
  }
}

function onMusic(m) {
  if (!brain) return;
  if (m.action === 'bop') { brain.setMusic(true); sfx('dance_loop', 0.18); }
  else if (m.action === 'excited') { brain.emote = { kind: 'star', t0: brain.t }; }
  else if (m.action === 'stop') { brain.setMusic(false); }
}

function onTyping(t) {
  if (!brain) return;
  if (t.action === 'pounce') {
    if (brain.stalk && brain.stalk.kind === 'butterfly') return;   // v3.13: mid butterfly-hunt
    // pounce toward the "keyboard" — the middle of the CURRENT lane (v3.13:
    // used to be the primary's center, half a screen away on monitor 2)
    const kx = O.x + REGION.w / 2 + (Math.random() - 0.5) * 200;
    const ky = brain.groundY - 30;
    if (['idle', 'sit', 'loaf', 'groom', 'walk'].includes(brain.state)) {
      if (brain.startStalk(kx, ky)) stalkWasCursor = true;   // v3.6.1: only when the stalk actually started
    }
  } else if (t.action === 'nap') {
    if (['idle', 'sit', 'loaf'].includes(brain.state)) brain.sleepNow();
  }
}

function onCursorIdle(p) {
  lastCursor = p;
  if (!brain || !S.stalkCursor) return;
  if (brain.stalk && brain.stalk.kind === 'butterfly') return;   // v3.13: never steal a butterfly hunt
  const d = Math.hypot(p.x - brain.x, p.y - brain.baseY);
  if (d < 340 && ['idle', 'sit', 'loaf', 'groom', 'walk'].includes(brain.state)) {
    if (brain.startStalk(p.x, p.y)) stalkWasCursor = true;   // v3.6.1: platform cats decline
  }
}
function onCursorBusy(p) {
  lastCursor = p;
  if (brain && brain.state === 'stalk' && brain.stalk && brain.stalk.kind !== 'butterfly') brain.stopStalk();   // "it moved!"
}

function onNewWindow(w) {
  if (brain && S.reactNewWindows) brain.investigate(w.x);
}

function onAppFocus(ev) {
  if (!brain || !S.reactApps) return;
  if (ev.kind === 'editor') {
    // curl up on top of the editor while you code
    if (['walk', 'idle', 'sit', 'loaf'].includes(brain.state)) {
      brain.goToPlatform(ev.rect);
    }
  } else if (ev.kind === 'game') {
    brain.celebrate();
    setTimeout(() => { if (brain) { brain._enter('zoomies', 2); } }, 1800);
  }
}

function onPomodoro(p) {
  pomoState = p;
  if (!brain) return;
  if (p.event === 'focus-done') {
    brain.celebrate();
    sfx('coin', 0.7);
    setTimeout(() => sfx('chirp', 0.7), 350);
  } else if (p.event === 'break-done') {
    showBubble('☕ break over — the cat is watching 👀', 4000);
  } else if (p.event === 'start' && p.mode === 'focus') {
    showBubble('🍅 focus time — the cat is supervising', 4000);
  }
}

function showAchievement(a) {
  showBubble(`${a.icon} Achievement: ${a.name} — ${a.desc}`, 5200);
  sfx('coin', 0.8);
  // v3.6.1: perks arrive with the unlock event (main computes them from the
  // fresh unlocked list) — rainbow pets etc. activate the moment they land
  if (a.perks) perks = { ...perks, ...a.perks };
  else refreshPerks();
}

// v3.6.1: perks used to stay false forever outside the test suite —
// recompute them from the unlocked list whenever anything might change it.
function refreshPerks() {
  try { perks = unlockedPerks(S.unlocked || []); } catch { /* keep old perks */ }
  window.__perksSet = true;
}

function startDanceParty() {
  if (!brain) return;
  const wa = brain.bounds;
  partyCats = [];
  for (let i = 0; i < 2; i++) {
    const b = new CatBrain({
      bounds: { ...wa }, groundY: brain.groundY, speed: 70,
      breed: i === 0 ? 'ginger_kitten' : (S.breed === 'panda' ? 'grey_tabby' : 'panda'),
    });
    b.x = Math.max(wa.x + 60, Math.min(wa.x + wa.width - 60, brain.x + (i === 0 ? -125 : 125)));
    b._enter('dance', 22);
    partyCats.push({ brain: b, breed: b.breed, alpha: 0.85 });
  }
  partyUntil = performance.now() / 1000 + 24;
  sfx('dance_loop', 0.3);
}

// ---------------------------------------------------------- photo mode
async function photoMode() {
  if (!S.photoMode || frozen || !brain) return;
  frozen = true;
  try {
    await new Promise(r => setTimeout(r, 140));         // let the pose settle
    const dataUrl = cv.toDataURL('image/png');
    const r = await window.meow.savePhoto(dataUrl);
    if (r && r.ok) showBubble('📸 Saved to ' + (r.path.split(/[\\/]/).pop()), 4200);
    else showBubble('📸 could not save the photo', 3600);
  } catch { showBubble('📸 photo failed', 3000); }
  flashUntil = performance.now() / 1000 + 0.28;
  setTimeout(() => { frozen = false; }, 950);
}

// ---------------------------------------------------------- companion cat
let companionLeashPx = 160;
function applyCompanion(on) {
  if (on && !companion && brain) {
    const b = new CatBrain({
      bounds: { ...brain.bounds }, groundY: brain.groundY, speed: 62,
      breed: 'ginger_kitten',
    });
    b.x = Math.max(brain.bounds.x + 80, Math.min(brain.bounds.x + brain.bounds.w - 80, brain.x - 150));
    b.setScale(S.size * 0.62);
    b.setPlatforms(brain.platforms);   // v3.13: the kitten may follow onto window tops
    companion = { brain: b, breed: 'ginger_kitten', hat: currentHat };
    xlog('companion', `companion kitten spawned at ${Math.round(b.x)}`, { breed: 'ginger_kitten' });
  } else if (!on) companion = null;
}

function companionBreedTick(dt) {
  if (!companion || !brain) return;
  const c = companion.brain;
  c.tick(dt);
  // v3.7/v3.8: stick close to the big cat. The kitten used to roam outside
  // the ~480px region window that follows the MAIN cat (clipped = "friend
  // cat not showing"), and v3.7's hard net TELEPORTED it back — a visible
  // "rendering jump". Worse, _enter('run') re-rolls the facing dir AFTER we
  // set it, so the kitten often sprinted the WRONG way first. Now: the
  // chase dir is re-asserted every frame while beyond the leash, the
  // catch-up run speeds up with the gap, and the safety net GLIDES the
  // kitten back smoothly instead of snapping it.
  const dx = brain.x - c.x;
  const beyond = Math.abs(dx) > companionLeashPx;
  // v3.13: never force the chase run mid-jump — _enter('run') would cancel
  // the join-jump lerp and strand the kitten below the platform it leaped for
  if (beyond && !c._jump && ['walk', 'idle', 'run', 'sit', 'loaf', 'groom'].includes(c.state)) {
    c._enter('run', 1.0);
  }
  if (beyond) {
    c.dir = dx > 0 ? 1 : -1;                                   // lock chase dir (anti re-roll)
    c.runSpeed = Math.min(340, 170 + (Math.abs(dx) - companionLeashPx) * 1.6);   // catch up faster when far
  } else {
    c.runSpeed = 150;                                          // back to the default sprint
  }
  // v3.13 COMPANION FOLLOW — the "companion cat is not showing" fix. The
  // chase camera frames the MAIN cat's feet: when the big cat sits on a
  // window top, the lane slides up and the ground-level kitten was pushed
  // BELOW the canvas (invisible) with no way up. Now the kitten leaps up to
  // join the big cat on its window top like a real kitten would, and a
  // kitten dozing far away wakes up when the pair separates.
  // (screen y grows downward: vGap > 0 means the big cat is ABOVE the kitten)
  c._joinCd = Math.max(0, (c._joinCd || 0) - dt);
  const vGap = c.baseY - brain.baseY;          // >0: the big cat is ABOVE the kitten
  const separated = beyond || vGap > 110;
  if (separated && !c._jump && ['sleep', 'curl', 'eat', 'groom', 'stretch', 'dance', 'knead', 'yawn', 'mope', 'sniff', 'nuzzle', 'roll', 'bamboo'].includes(c.state)) {
    c._enter('idle', 0.8);                     // wake — the friend left without me
  }
  if (brain.onPlatform && !c.onPlatform && !c._jump && vGap > 110 && c._joinCd <= 0 &&
      !['pounce', 'stalk', 'laser', 'rear'].includes(c.state)) {
    c._jumpTo(brain.onPlatform, 0.6 + Math.min(0.85, vGap / 460));   // leap up to the big cat
    c._joinCd = 2.5;
  }
  // v3.9: the kitten may NEVER leave the visible region canvas. During a
  // violent reel the camera chases the pair's midpoint and used to lag the
  // sprinting kitten — off-canvas = invisible ("friend cat not showing", the
  // v3.7 complaint). While the kitten is off-canvas we SKIP the reel and glide
  // it back into view at a single capped rate (850px/s ≈ 14px/frame): it rides
  // back on-stage smoothly instead of snapping, and once visible the normal
  // reel takes over. Natural play (dist < 200px) never leaves the band.
  const kitLo = O.x - 40, kitHi = O.x + REGION.w + 40;
  const offStage = c.x < kitLo || c.x > kitHi;
  if (offStage) {
    if (c.x < kitLo) c.x = Math.min(kitLo, c.x + 850 * dt);
    else c.x = Math.max(kitHi, c.x - 850 * dt);
  } else {
    // smooth safety net (never a teleport): if somehow stuck far out — e.g. on
    // a window top that runs away from the main cat — slide toward the leash
    // edge at up to 420 px/s, which reads as a frantic dash, not a glitch.
    const overflow = Math.abs(dx) - (companionLeashPx + 90);
    if (overflow > 0 && !c._jump) {
      const step = Math.min(overflow, 420 * dt);
      c.x += Math.sign(dx) * step;
    }
  }
  // nuzzle / play-fight when close and both are calm
  companionCd -= dt;
  if (companionCd <= 0) {
    companionCd = 8 + Math.random() * 9;
    const dist = Math.abs(c.x - brain.x);
    const calm = ['idle', 'sit', 'loaf'].includes(brain.state) && ['idle', 'sit', 'loaf'].includes(c.state);
    if (dist < 130 && calm) {
      const doPlayFight = Math.random() < 0.4;
      if (doPlayFight) {
        // play-fight: companion pounces at the big cat
        c._enter('pounce', 1.9);
        c.dir = dx > 0 ? 1 : -1;
        brain.poke();
        playSfxSafe('chirp', 0.35);
      } else {
        // nuzzle: both face each other, hearts fly, affection grows
        c.nuzzleNow(dx > 0 ? 1 : -1);
        brain.nuzzleNow(dx > 0 ? -1 : 1);
        window.meow.bumpStat('nuzzles', 1);
        window.meow.petAffection();
        playSfxSafe('purr_real', 0.25);
      }
    }
  }
}
function playSfxSafe(n, v) { sfx(n, v); }

// ---------------------------------------------------------- region sync
// v3.8: fully synchronized like the slide path — the canvas origin + size
// are committed ONLY after the OS window actually landed on the new rect.
// The old code flipped O and resized the canvas immediately while the
// setBounds was still in flight, so the cat visibly jumped/distorted for a
// few frames on every size-slider change, workArea change and at boot.
let regionResizeSeq = 0;        // monotonic token; a newer resize supersedes an older one
let regionResizeInFlight = false;
async function syncRegion() {
  // v3.11 LANE: the lane's SIZE comes from the primary work area (a full-width
  // ground strip — zero window moves while the cat walks), while its ORIGIN is
  // clamped against the roaming union so multi-display moves stay reachable.
  const laneWA = primaryBounds(S);
  const roam = roamBounds(S);
  REGION = computeRegionSize(S.size, laneWA);
  companionLeashPx = companionLeash(REGION.w);
  const feet = brain ? brain.baseY + brain.jumpY : laneWA.y + laneWA.height - 8;
  const cx = brain ? brain.x : laneWA.x + laneWA.width / 2;
  const nO = initialOrigin(roam, REGION, cx, feet);
  const needMove = !O || nO.x !== O.x || nO.y !== O.y || cv.width !== REGION.w || cv.height !== REGION.h;
  if (!needMove) return;
  const token = ++regionResizeSeq;
  regionResizeInFlight = true;
  let res = null;
  try { res = await window.meow.moveRegion({ x: nO.x, y: nO.y, w: REGION.w, h: REGION.h }); }
  catch { /* window gone — keep local values */ }
  if (token !== regionResizeSeq) return;      // a newer resize took over
  regionResizeInFlight = false;
  // main clamps the rect against the real work area — adopt its answer
  if (res && Number.isFinite(res.w) && Number.isFinite(res.h)) REGION = { w: res.w, h: res.h };
  O = res ? { x: res.x, y: res.y } : nO;
  cv.width = REGION.w; cv.height = REGION.h;
  cv.style.width = REGION.w + 'px'; cv.style.height = REGION.h + 'px';
  try { paint(); } catch { /* next frame repaints anyway */ }
}

function applySettings(kv) {
  S = { ...S, ...kv };
  if (kv.speed && brain) brain.speed = kv.speed;
  if (kv.breed && brain) { brain.breed = kv.breed; applyHat(); }
  if (kv.size != null) {
    if (brain) brain.setScale(kv.size);
    if (companion) companion.brain.setScale(kv.size * 0.62);
    syncRegion();
  }
  if (kv.seasonalSkins !== undefined || kv.customSkins !== undefined) {
    registerCustomSkins(S.customSkins);
    applyHat();
  }
  if (kv.companionCat !== undefined) applyCompanion(!!kv.companionCat);
  if (kv.timeOfDayMood !== undefined) applyTimeBias();
  if (kv.unlocked !== undefined || kv.achievements !== undefined) refreshPerks();
  if (kv.reactLowBattery !== undefined) applyBatteryCrisis();   // v3.6.1: re-check on toggle
  if ((kv.noWalkZoneList !== undefined || kv.noWalkZones !== undefined) && brain) {
    const zones = S.noWalkZones === false ? [] : (S.noWalkZoneList || []);
    brain.setNoWalkZones(zonesToScreen(zones, brain.bounds));
  }
}

function doAction(act) {
  if (!brain) return;
  if (act === 'sleep') brain.sleepNow();
  else if (act === 'eat') brain.feed();
  else if (act === 'dance') { brain.dance(); play('dance_loop', 0.5); }
  else if (act === 'happy') brain.pet();
}

// ---------------------------------------------------- v3.5 laser toy
// v3.13: lane-relative — the dot used to clamp into the PRIMARY work area,
// so firing the laser while the cat was on the 2nd monitor spawned the dot
// on a screen the cat was not on (same bug class as the butterfly).
function spawnLaser() {
  if (!brain) return;
  const lo = O.x + 40, hi = O.x + REGION.w - 40;
  const ang = Math.random() * Math.PI * 2;
  const dist = 220 + Math.random() * 160;
  const x = Math.max(lo, Math.min(hi, brain.x + Math.cos(ang) * dist));
  const groundY = brain.groundY;
  const y = groundY - 20 - Math.random() * 90;
  laser = { x, y, vx: 0, vy: 0, born: performance.now() / 1000 };
  brain.startLaser(x, y);
  sfx('patter', 0.2);
}

function killLaser() {
  laser = null;
  if (brain) brain.stopLaser();
}

function tickLaser(dt) {
  if (!laser || !brain) return;
  if (!brain.laser) { laser = null; return; }
  const catX = brain.x, catY = brain.baseY;
  const dx = laser.x - catX, dy = laser.y - catY;
  const dist = Math.hypot(dx, dy);
  laser.vx += (Math.random() - 0.5) * 46 * dt;
  laser.vy += (Math.random() - 0.5) * 30 * dt;
  if (dist < 95 && brain.state !== 'pounce') {
    laser.vx += (dx / (dist || 1)) * 190 * dt;
    laser.vy += (dy / (dist || 1)) * 130 * dt;
  }
  const spd = Math.hypot(laser.vx, laser.vy);
  const MAX = 130;
  if (spd > MAX) { laser.vx *= MAX / spd; laser.vy *= MAX / spd; }
  laser.x += laser.vx * dt;
  laser.y += laser.vy * dt;
  const groundY = brain.groundY;
  laser.x = Math.max(O.x + 30, Math.min(O.x + REGION.w - 30, laser.x));
  laser.y = Math.max(groundY - 170, Math.min(groundY - 12, laser.y));
  if (Math.abs(laser.x - catX) > 340) laser.vx = (catX > laser.x ? 1 : -1) * Math.abs(laser.vx || 60);
  brain.moveLaser(laser.x, laser.y);
}

let _gagFlags = {};
function gagSounds() {
  if (!brain) return;
  const st = brain.state;
  if (_gagFlags.state !== st) _gagFlags = { state: st };
  if (st === 'sneeze' && !_gagFlags.blast && brain.stateT >= 0.72) {
    _gagFlags.blast = true; sfx('whoosh', 0.55);
  }
  if (st === 'hairball' && !_gagFlags.growl) {
    _gagFlags.growl = true; sfx('growl_real', 0.22);
  }
  if (st === 'zoomies' && !_gagFlags.chirp) {
    _gagFlags.chirp = true; sfx('chirp', 0.5);
  }
}

// v3.12: contextual one-shots (jumps, coins, gags, toys) honor the
// "Contextual sounds" toggle; meows and purrs have their own toggles.
function sfx(name, vol) { if (!S.contextualSounds) return; play(name, vol); }

// ------------------------------------------------ v3.13 butterfly
// The butterfly lives in src/butterfly.js (pure, unit-tested). cat.html owns
// the scheduling, the brain feeding and the catch rewards.
function scheduleButterfly(delaySec) {
  clearTimeout(butterflyTimer);
  const wait = (delaySec != null ? delaySec : (18 + Math.random() * 24)) * 1000;
  butterflyTimer = setTimeout(() => {
    spawnButterfly();
    scheduleButterfly();
  }, wait);
}

function spawnButterfly() {
  if (!brain || butterfly || frozen) return;
  // v3.13: spawn relative to the CURRENT lane — the old code used the
  // primary work area, so on the 2nd monitor the butterfly crossed a screen
  // the cat was not on and was NEVER seen. It now always flies across the
  // cat's visible canvas, on every display, entering from the nearer edge.
  butterfly = bflySpawn({
    lane: { x: O.x, w: REGION.w },
    catX: brain.x,
    groundY: brain.groundY,
    now: performance.now() / 1000,
  });
}

function tickButterfly(dt, now) {
  if (!butterfly || !brain) return;
  const culled = bflyTick(butterfly, {
    dt, now,
    lane: { x: O.x, w: REGION.w },
    groundY: brain.groundY,
    catX: brain.x,
  });
  if (culled) { butterfly = null; bflyAttempts = 0; return; }
  if (bflyPin) { butterfly.x = bflyPin.x; butterfly.y = bflyPin.y; butterfly.state = bflyPin.state || butterfly.state; }   // e2e determinism
  // the hunt died without a pounce (timeout, laser, drag) — calm down again
  if (butterfly.state === 'hunted' && !(brain.stalk && brain.stalk.kind === 'butterfly')) {
    butterfly.state = 'cruise';
    brain.stalkBoost = 1;
  }
  // feed the hunter with the butterfly's live position
  if (brain.stalk && brain.stalk.kind === 'butterfly') {
    brain.moveStalk(butterfly.x, butterfly.y);
    return;
  }
  // start a new hunt: an idle-ish ground cat notices a nearby butterfly
  bflyHuntCd = Math.max(0, bflyHuntCd - dt);
  if (bflyHuntCd <= 0 && !dragging && !brain.laser && !brain.stalk && !brain.onPlatform &&
      butterfly.state === 'cruise' &&
      Math.abs(butterfly.x - brain.x) < BFLY_HUNT_RADIUS &&
      ['idle', 'sit', 'loaf', 'groom', 'walk'].includes(brain.state) &&
      brain.startStalk(butterfly.x, butterfly.y, 'butterfly')) {
    butterfly.state = 'hunted';
    brain.stalkBoost = 2.3;          // a butterfly will not wait all day
    sfx('chirp', 0.4);               // the excited "I see it!" chirp
    xlog('hunt', `butterfly noticed at ${Math.round(butterfly.x)},${Math.round(butterfly.y)} — stalking begins`, { hue: butterfly.hue });
  }
}

// the stalk pounce just launched — resolve catch / miss at the moment of
// truth (the transition INTO 'pounce' while hunting)
function resolveButterflyPounce() {
  brain.stalkBoost = 1;
  if (butterfly && butterflyCatchable(butterfly, { x: brain.x, baseY: brain.baseY })) {
    // CAUGHT — caught mid-pounce, reward lands when the pounce lands
    butterfly = null;
    bflyAttempts = 0;
    bflyCaughtPending = true;
    brain.emote = { kind: 'heart', t0: brain.t };
    sfx('chirp', 0.6);
    xlog('hunt', 'pounce connected — butterfly caught mid-leap');
  } else {
    // missed — the butterfly darts away; the cat may try again (up to 3)
    bflyAttempts++;
    bflyHuntCd = 1.8;
    xlog('hunt', `pounce missed (${bflyAttempts}/3) — butterfly darts away`);
    if (butterfly) startleButterfly(butterfly, brain.x, performance.now() / 1000);
  }
}

// v3.14 THE REARING SWAT — the cat stands on its hind legs and a front paw
// strikes at the butterfly above its head. The brain fires 'rear:swat' at
// each paw apex (two per rear); we judge the geometry at that instant.
function resolveButterflySwat() {
  if (!butterfly || !brain) return;
  // paw point: in front of the raised head, ~105px above the feet
  const pawX = brain.x + brain.dir * 26;
  const pawY = brain.baseY - 104;
  if (swatCatchable(butterfly, pawX, pawY)) {
    // CAUGHT with the paws — the hunt is over; stop stalking so the rear
    // flows straight into the celebration instead of more creeping
    butterfly = null;
    bflyAttempts = 0;
    bflyCaughtPending = true;
    brain.stopStalk();
    brain.stalkBoost = 1;
    brain.emote = { kind: 'heart', t0: brain.t };
    sfx('chirp', 0.6);
    xlog('hunt', 'SWAT CONNECTED — butterfly seized with the front paws', { paw: { x: Math.round(pawX), y: Math.round(pawY) } });
  } else {
    // DODGED — the butterfly jinks away and up; the cat drops and chases
    bflyAttempts++;
    bflyHuntCd = 1.6;
    sfx('chirp', 0.3);
    if (bflyAttempts >= 3) {
      // three swats missed — the cat gives up, the butterfly lives
      brain.stopStalk();
      brain.stalkBoost = 1;
      bflyAttempts = 0;
      bflyHuntCd = 12;
      dodgeButterfly(butterfly, pawX, pawY, performance.now() / 1000);
      butterfly.fleeUntil = performance.now() / 1000 + 2.2;   // really gone
      xlog('hunt', 'three swats missed — the cat gives up, the butterfly escapes');
    } else {
      dodgeButterfly(butterfly, pawX, pawY, performance.now() / 1000);
      xlog('hunt', `swat ${bflyAttempts} missed — butterfly dodges up and away`, { paw: { x: Math.round(pawX), y: Math.round(pawY) } });
    }
  }
}

// ---------------------------------------------------------- bubbles
// v3.8: keep overlays fully inside the region window. The bubble used to be
// clamped only on the left/top, so a cat near the region's right/bottom edge
// had its text clipped by the transparent overlay (half-readable reminders,
// cut-off achievements). Measure the real box, then clamp both axes.
function clampBox(el, x, y) {
  const w = el.offsetWidth || 240, h = el.offsetHeight || 44;
  const maxX = Math.max(8, REGION.w - w - 8);
  const maxY = Math.max(8, REGION.h - h - 8);
  el.style.left = Math.max(8, Math.min(x, maxX)) + 'px';
  el.style.top = Math.max(8, Math.min(y, maxY)) + 'px';
}

function showBubble(text, ms = 5000) {
  if (!brain) return;
  const p = brain.pose;
  const scale = S.size;
  bubble.textContent = text;
  bubble.style.display = 'block';
  clampBox(bubble, p.x - 20 - 110 - O.x, p.y - 150 * scale - 78 - O.y);
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => { bubble.style.display = 'none'; }, ms);
}

function showReminder(item) {
  if (!brain) return;
  (window.__firedReminders = window.__firedReminders || []).push(item.label);
  // v3.6.1: honor the "Cat does" choice (main already counted the stat —
  // the renderer-side bump used to double-count every reminder)
  const anim = item.anim || 'dance';
  if (anim === 'eat') brain.feed();
  else if (anim === 'sleep') brain.sleepNow();
  else if (anim === 'happy') brain.pet();
  else if (anim === 'jump') brain._enter('jump', 0.75);
  else brain.dance();
  const p = brain.pose;
  const scale = S.size;
  // v3.8: the bubble IS the reminder delivery — show the message, clamped
  // inside the region so even long messages are fully readable
  bubble.textContent = '⏰ ' + item.label;
  bubble.style.display = 'block';
  clampBox(bubble, p.x - 20 - 110 - O.x, p.y - 150 * scale - 70 - O.y);
  // v3.12: the reminder chime has its own toggle in the Sounds settings
  if (S.sounds && S.soundReminders) play('chirp', 0.8);
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => { bubble.style.display = 'none'; }, 8000);
}

// ---------------------------------------------------------- mouse / click-through
let overCat = false;
let dragging = false;
let dragDX = 0, dragDY = 0;
let downX = 0, downY = 0;
let downSX = 0, downSY = 0;   // v3.12: grab point in SCREEN coords (see mousemove)
let pendingPet = null;
let dragMoved = false;        // v3.12: authoritative drag-intent flag
let downOnCat = false;   // v3.7: quick click = real meow

function toScreen(cx, cy) { return { x: cx + O.x, y: cy + O.y }; }

function catHit(mx, my) {
  if (!brain) return false;
  const p = brain.pose;
  const s = S.size;
  const cx = p.x, cy = p.y;
  const b = CAT_BBOX;
  const x0 = cx + b.x * s, x1 = cx + (b.x + b.w) * s;
  const y0 = cy + b.y * s, y1 = cy + b.h * s;
  return mx >= x0 && mx <= x1 && my >= y0 && my <= y1;
}

// v3.12 MAIN-DRIVEN DRAG — mousedown hands the drag to main, which streams
// the REAL global cursor (screen.getCursorScreenPoint at ~60Hz). This is the
// cross-monitor fix: renderer mousemove dies the moment the cursor leaves
// the window, which is exactly what happens at a monitor boundary.
let mainDragActive = false;
let lastDragPosTs = 0;
window.meow.on('drag-pos', p => {
  if (!brain || !dragging) return;
  lastDragPosTs = performance.now();
  brain._jump = null;
  brain.onPlatform = null;
  brain.x = Math.max(brain.bounds.x + 60, Math.min(brain.bounds.x + brain.bounds.w - 60, p.x));
  brain.baseY = Math.max(brain.bounds.y + 120, Math.min(brain.bounds.y + brain.bounds.h - 8, p.y));
  brain.jumpY = 0;
  // v3.12: the poller is the AUTHORITATIVE cursor source — real cursor motion
  // is drag intent. Renderer-synthesized hover mousemoves (which fire when the
  // cat/window shifts under a STATIC cursor) are noise and are ignored.
  if (Math.hypot((p.x + dragDX) - downSX, (p.y + dragDY) - downSY) > 6) dragMoved = true;
  if (dragMoved && pendingPet) { clearTimeout(pendingPet); pendingPet = null; }
  if (Number.isFinite(p.ox) && Number.isFinite(p.oy)) {
    // v3.12 e2e instrumentation parity: the window "moved" whenever main
    // lands it on a new origin (the drag follow metric used by e2e)
    if (p.ox !== O.x || p.oy !== O.y) window.__regionMoves = (window.__regionMoves || 0) + 1;
    O = { x: p.ox, y: p.oy };   // window already moved by main
  }
});

window.addEventListener('mousemove', e => {
  const m = toScreen(e.clientX, e.clientY);
  const hit = dragging || catHit(m.x, m.y);
  if (hit !== overCat) { overCat = hit; window.meow.hitTest(hit); }
  if (dragging) {
    // v3.12: while MAIN drives the drag, client mousemoves are not trusted —
    // they include hover-recompute noise generated when the cat/window moves
    // under a static cursor, and that noise used to cancel the pending
    // pet/meow of every quick tap. Intent comes from the drag-pos stream.
    // When main is NOT driving (headless/dev fallback), screen-space deltas
    // (window-movement-invariant) decide drag intent.
    if (!mainDragActive) {
      const moved = Math.abs(m.x - downSX) + Math.abs(m.y - downSY);
      if (moved > 6) dragMoved = true;
      if (dragMoved && pendingPet) { clearTimeout(pendingPet); pendingPet = null; }
    }
    // v3.6.1: grabbing the cat mid-jump must cancel the flight, or the jump
    // lerp would fight the drag and teleport the cat on landing
    brain._jump = null;
    brain.onPlatform = null;
    // v3.12: while main drives the drag this is a no-op mirror (main already
    // clamps with identical margins); it stays as the fallback when the
    // drag-pos stream is unavailable (e.g. headless dev).
    brain.x = Math.max(brain.bounds.x + 60, Math.min(brain.bounds.x + brain.bounds.w - 60, m.x - dragDX));
    brain.baseY = Math.max(brain.bounds.y + 120, Math.min(brain.bounds.y + brain.bounds.h - 8, m.y - dragDY));
    brain.jumpY = 0;
  }
});
window.addEventListener('mousedown', e => {
  const m = toScreen(e.clientX, e.clientY);
  if (!catHit(m.x, m.y)) { downOnCat = false; return; }
  if (e.button !== 0) return;
  downOnCat = true;   // v3.7: click-vs-pet discrimination on release
  downX = e.clientX; downY = e.clientY;
  downSX = m.x; downSY = m.y;   // v3.12: screen-space tap anchor
  dragMoved = false;            // v3.12: a new press starts with no drag intent
  dragDX = m.x - brain.x;
  dragDY = m.y - brain.baseY;
  dragging = true;
  // v3.12: main takes over the follow with the true global cursor
  mainDragActive = true;
  lastDragPosTs = performance.now();
  try { window.meow.dragStart({ x: dragDX, y: dragDY }); } catch { mainDragActive = false; }
  if (pendingPet) clearTimeout(pendingPet);
  pendingPet = setTimeout(async () => {
    pendingPet = null;
    brain.pet();
    play('purr_real', 0.9);
    window.meow.addCoins(2);
    // v3.6: affection meter + petting achievements
    const r = await window.meow.petAffection();
    if (r && perks.rainbowPet && Math.random() < 0.3) {
      brain.emote = { kind: 'rainbow', t0: brain.t };
    } else if (r && r.progress && r.progress.next && Math.random() < 0.25) {
      brain.emote = { kind: 'heart', t0: brain.t };
    }
  }, 280);
});
window.addEventListener('mouseup', e => {
  if (dragging) brain.dropAt(brain.x, brain.baseY);
  dragging = false;
  if (mainDragActive) { mainDragActive = false; try { window.meow.dragEnd(); } catch {} }
  // v3.7: a quick click on the cat = a real meow + a tiny heart. Holding the
  // button past 280ms is the pet (pendingPet fires); a drag cancels both via
  // the move guard in mousemove.
  // v3.11: the QUICK CLICK plays the natural SINGLE meow (meow_single).
  // v3.12: a double-click NO LONGER opens anything — it only plays the
  // classic meow voice (kept exactly as it sounded before, per request).
  if (pendingPet && downOnCat) {
    clearTimeout(pendingPet); pendingPet = null;
    // v3.11: ONE natural single meow per click — the new dedicated voice
    playMeowSingle(0.95);
    if (brain) brain.emote = { kind: 'heart', t0: brain.t };
    window.meow.bumpStat('pets', 1);
  }
  downOnCat = false;
});
window.addEventListener('blur', () => {
  // v3.12: never leave the main-side cursor poller running on a lost window
  if (dragging) { try { brain.dropAt(brain.x, brain.baseY); } catch {} }
  dragging = false;
  if (mainDragActive) { mainDragActive = false; try { window.meow.dragEnd(); } catch {} }
});
window.addEventListener('dblclick', e => {
  const m = toScreen(e.clientX, e.clientY);
  if (!catHit(m.x, m.y)) return;
  if (pendingPet) { clearTimeout(pendingPet); pendingPet = null; }
  dragging = false;
  // v3.12 USER RULE: double click ONLY plays the sound — the Cat Store /
  // Settings no longer open here (they stay in the tray + context menu).
  stopMeowSingle();
  playMeow(0.95);
});
window.addEventListener('contextmenu', e => {
  e.preventDefault();
  window.meow.contextMenu({ x: e.clientX, y: e.clientY });
});

// v3.12: FOOTSTEP SOUNDS REMOVED (user request) — the constant patter while
// walking/running/zoomies and the glass paw-taps on window edges are gone;
// the cat moves in silence. Scratch keeps its sound (a deliberate action,
// not locomotion), still gated by the Contextual sounds toggle.
let lastStepPhase = 0;
function stepSounds() {
  if (!brain) return;
  if (brain.state === 'scratch') {
    const ph = Math.floor(brain.t * 10.5);
    if (ph !== lastStepPhase) { lastStepPhase = ph; sfx('scratch', 0.35); }
  } else lastStepPhase = -1;
}

// ---------------------------------------------------------- main loop
let lastTs = performance.now();
const IDLE_STATES = new Set(['idle', 'sit', 'sleep', 'loaf', 'knead', 'groom', 'eat', 'bamboo', 'sniff', 'mope', 'nuzzle', 'curl']);
let idleFrameSkip = 0;
let catVisible = true;
let rafId = 0;
let lastChaseTs = 0;        // v3.9: chase-camera clock (rate-limited origin catch-up)
let trackedPlatId = null;   // v3.9: platform hwnd currently tracked in main
// v3.12: ground states stroll along the lane — horizontal coverage comes from
// the lane hop (one move per monitor crossing), never from the chase.
const GROUND_STATES = new Set(['walk', 'run', 'waddle', 'zoomies', 'stalk', 'laser']);
let lastHopAt = 0;          // v3.12: lane-hop cooldown clock
function loop(ts) {
  // v3.7: clamp dt — a renderer stall (window move, GC, system sleep) used to
  // hand the brain a huge step and teleport the cat on the next frame.
  const dt = Math.min(0.11, Math.max(0, (ts - lastTs) / 1000));
  // v3.9: while the platform tracker is carrying the cat (active ride targets),
  // never idle-throttle — the throttled 4-frame batching would turn the smooth
  // ≤700px/s carry into visible 45px lurches.
  const riding = !!(brain && brain.onPlatform &&
    (Number.isFinite(brain.onPlatform._ty) || Number.isFinite(brain.onPlatform._tx)));
  const throttle = brain && !frozen && IDLE_STATES.has(brain.state) && !dragging && !riding;
  // v3.9: deep-idle states (sleep/curl) animate at ~7.5fps — a sleeping cat
  // only breathes; 15fps idle throttle used to pay full paint cost for it.
  const skipMax = (brain && (brain.state === 'sleep' || brain.state === 'curl')) ? 7 : 3;
  if (throttle && idleFrameSkip < skipMax) {
    idleFrameSkip++;
    rafId = requestAnimationFrame(loop);
    return;
  }
  idleFrameSkip = 0;
  lastTs = ts;
  if (brain) {
    if (!frozen) {
      brain.speed = S.speed;
      // v3.6: feed the live cursor position into an active stalk
      // (v3.13: never into a butterfly hunt — the butterfly feeds that one)
      if (brain.state === 'stalk' && brain.stalk && brain.stalk.kind !== 'butterfly' && lastCursor) brain.moveStalk(lastCursor.x, lastCursor.y);
      const before = brain.state;
      brain.tick(dt);
      // ------- state-transition bookkeeping (stats + contextual sfx) -------
      if (before !== brain.state) {
        xlog('action', `${before} → ${brain.state}`, { x: brain.x, feetY: Math.round(brain.baseY), dir: brain.dir });
        if (brain.state === 'jump') sfx('squeak', 0.42);   // boing! (v3.12: via sfx)
        if (before === 'jump' && brain.jumpP === 0) {
          window.meow.bumpStat('jumps', 1);
          if (perks.sparkleLand) sfx('land', 0.5); else sfx('land', 0.35);
        }
        if (before === 'eat') window.meow.bumpStat('fish', 1);
        // v3.13: the butterfly hunt's moment of truth — the stalk pounce
        // launching at the butterfly resolves catch vs miss right here
        if (before === 'stalk' && brain.state === 'pounce' &&
            brain.stalk && brain.stalk.kind === 'butterfly') {
          resolveButterflyPounce();
        }
        // v3.14: the REAR ended (caught or gave up) — deliver the reward here
        if (before === 'rear' && brain.state !== 'rear' && bflyCaughtPending) {
          bflyCaughtPending = false;
          brain.pet();
          window.meow.addCoins(2);
          window.meow.bumpStat('butterflies', 1);
          showBubble('🦋 got it! the cat is very proud', 3200);
          xlog('reward', 'butterfly caught — +2 coins, butterflies stat +1');
          scheduleButterfly(9 + Math.random() * 7);   // the next visitor soon
        }
        if (before === 'pounce' && stalkWasCursor) {
          // the cursor-stalk pounce landed: happy cat, tiny affection boost
          stalkWasCursor = false;
          brain.stopStalk();
          brain.pet();
          play('purr_real', 0.5);
          window.meow.petAffection();
        }
        // v3.13: the pounce LANDED — deliver the caught-butterfly reward
        if (before === 'pounce' && brain.state !== 'pounce' && bflyCaughtPending) {
          bflyCaughtPending = false;
          brain.pet();
          window.meow.addCoins(2);
          window.meow.bumpStat('butterflies', 1);
          showBubble('🦋 got it! the cat is very proud', 3200);
          scheduleButterfly(9 + Math.random() * 7);   // the next visitor soon
        }
      }
      stepSounds();
      gagSounds();
      const nowS = performance.now() / 1000;
      tickLaser(dt);
      tickButterfly(dt, nowS);
      companionBreedTick(dt);
      // laser resolution
      if (laser && prevState === 'pounce' && brain.state !== 'pounce' && brain.laser) {
        const d = Math.hypot(laser.x - brain.x, laser.y - brain.baseY);
        if (d < 95) {
          sfx('coin', 0.8);
          brain.emote = { kind: 'star', t0: brain.t };
          window.meow.addCoins(3);
          window.meow.bumpStat('lasers', 1);
          killLaser();
          brain.pet();
        } else {
          const ang = Math.random() * Math.PI * 2;
          laser.x = brain.x + Math.cos(ang) * (140 + Math.random() * 120);
          laser.y = Math.max(brain.bounds.y + 140, brain.baseY - Math.abs(Math.sin(ang)) * 60) - 20 * Math.random();
          brain.moveLaser(laser.x, laser.y);
        }
      }
      prevState = brain.state;
      // dance party lifetime
      if (partyCats && nowS > partyUntil) partyCats = null;
      if (partyCats) for (const pc of partyCats) {
        pc.brain.tick(dt);
        if (pc.brain.state !== 'dance') pc.brain._enter('dance', 4);
      }
    }
    // v3.9 THE CHASE CAMERA — see region.js. v3.11 turns the overlay into a
    // full-width GROUND LANE so ordinary walking never moves the window at
    // all (the walking-flicker root cause), and keeps the chase for the rare
    // vertical cases.
    // v3.12: while the user drags, MAIN drives the window from the true
    // global cursor (the cross-monitor fix) — the renderer only mirrors the
    // positions it streams. The chase stays as a fallback for a stalled
    // stream. Ground strolling gains the LANE HOP: one discrete window move
    // when the walk reaches the lane's edge with another monitor beyond it —
    // so the cat can WALK onto the 2nd monitor while single-display walking
    // keeps its zero-moves guarantee.
    {
      const p0 = brain.pose;
      const wa0 = roamBounds(S);
      const focusX = companion ? (p0.x + companion.brain.pose.x) / 2 : p0.x;
      const feetY = p0.y;   // pose.y is already baseY + jumpY (the live feet point)
      const mainDragFresh = dragging && mainDragActive && (performance.now() - lastDragPosTs < 250);
      const ground = GROUND_STATES.has(brain.state);
      const nowMs0 = performance.now();
      const hopT = (!dragging && ground && !frozen && !regionResizeInFlight && nowMs0 - lastHopAt > 400)
        ? laneHopTarget(O, REGION, p0.x, wa0) : null;
      let cand = null;
      if (dragging) {
        if (!mainDragFresh) cand = dragChaseTarget(O, REGION, focusX, feetY, wa0);
      } else if (hopT) {
        // THE LANE HOP — one awaited move, then the stroll continues on the
        // next display with the cat mid-lane again.
        lastHopAt = nowMs0;
        regionResizeInFlight = true;
        window.__hops = (window.__hops || 0) + 1;   // e2e instrumentation
        (async (tgt) => {
          try {
            const res = await window.meow.moveRegion({ x: tgt.x, y: tgt.y, w: REGION.w, h: REGION.h });
            if (res && Number.isFinite(res.x) && Number.isFinite(res.y)) O = { x: res.x, y: res.y };
            try { paint(); } catch { /* next frame repaints anyway */ }
          } catch { /* window gone — keep local values */ }
          finally { regionResizeInFlight = false; }
        })(hopT);
      } else {
        cand = slideIfNeeded(O, REGION, focusX, feetY, wa0, S.size,
          ground ? { horizontal: false } : undefined);
      }
      if (cand && !frozen && !regionResizeInFlight) {
        const nowMs = performance.now();
        // v3.12: clamp the effective interval to ONE painted frame (33ms).
        // After an idle-throttle burst the wall-clock gap used to hand the
        // chase a 60-100ms cdt — a single 60-90px camera leap, i.e. exactly
        // the "small rendering jump" this camera exists to prevent.
        const cdt = Math.min(0.033, Math.max(0.008, (nowMs - lastChaseTs) / 1000 || 0.016));
        lastChaseTs = nowMs;
        const cap = (dragging ? DRAG_CHASE_V : CHASE_V) * cdt;
        const step = chaseStep(O, cand, cap);
        const clamped = clampOrigin({ x: step.x, y: step.y, w: REGION.w, h: REGION.h }, REGION, wa0);
        if (clamped.x !== O.x || clamped.y !== O.y) {
          O = { x: clamped.x, y: clamped.y };
          window.meow.moveRegion({ x: O.x, y: O.y, w: REGION.w, h: REGION.h });   // fire & forget
          window.__regionMoves = (window.__regionMoves || 0) + 1;   // e2e instrumentation
        }
      } else lastChaseTs = performance.now();
    }
    paint();
    // v3.9: retarget the platform tracker whenever the cat lands on / leaves
    // a window top (fire-and-forget; main owns the persistent poller).
    const platId = brain.onPlatform && Number.isFinite(brain.onPlatform.id) ? brain.onPlatform.id : null;
    if (platId !== trackedPlatId) {
      trackedPlatId = platId;
      window.meow.trackPlatform(platId);
    }
  }
  if (catVisible) rafId = requestAnimationFrame(loop);
}

// v3.7: pure draw of the current state (no ticking) — used by the rAF loop
// AND right after a region slide lands, so the cat is never drawn at a stale
// window position.
function paint() {
  if (!brain) return;
  window.__paintCount = (window.__paintCount || 0) + 1;   // e2e: CPU probe counts real paints
  const p = brain.pose;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.translate(p.x - O.x, p.y - O.y);
  const opts = {
    t: p.t, state: p.state, dir: p.dir, breed: S.breed,
    scale: S.size, alpha: S.opacity, jumpP: p.jumpP, hat: currentHat,
    stateT: p.stateT, stateDur: p.stateDur,
  };
  drawCat(ctx, opts);
  drawParticles(ctx, opts);
  if (brain.emote && brain.emote.kind) {
    const age = brain.t - brain.emote.t0;
    if (age < 2) {
      const E = emoteAnchor(S.breed);
      drawEmote(ctx, {
        kind: brain.emote.kind, t: age,
        x: E.x, y: E.y, scale: S.size,
      });
    } else brain.emote = null;
  }
  ctx.restore();
  // companion cat
  if (companion) {
    const cp = companion.brain.pose;
    ctx.save();
    ctx.translate(cp.x - O.x, cp.y - O.y);
    drawCat(ctx, { t: cp.t, state: cp.state, dir: cp.dir, breed: companion.breed, scale: S.size * 0.62, alpha: S.opacity, jumpP: cp.jumpP, hat: companion.hat, stateT: cp.stateT, stateDur: cp.stateDur });
    drawParticles(ctx, { t: cp.t, state: cp.state, breed: companion.breed, scale: S.size * 0.62 });
    ctx.restore();
  }
  // dance party ghosts
  if (partyCats) {
    for (const pc of partyCats) {
      const pp = pc.brain.pose;
      ctx.save();
      ctx.translate(pp.x - O.x, pp.y - O.y);
      drawCat(ctx, { t: pp.t, state: pp.state, dir: pp.dir, breed: pc.breed, scale: S.size * 0.7, alpha: 0.8 * S.opacity, jumpP: pp.jumpP });
      ctx.restore();
    }
  }
  // v3.5 toys
  if (butterfly) {
    ctx.save();
    ctx.translate(butterfly.x - O.x, butterfly.y - O.y);
    drawButterfly(ctx, { t: p.t, scale: S.size, hue: butterfly.hue, s: 1.15 });
    ctx.restore();
  }
  if (laser) {
    ctx.save();
    ctx.translate(laser.x - O.x, laser.y - O.y);
    drawLaser(ctx, { t: p.t, scale: S.size });
    ctx.restore();
  }
  // photo flash
  const nowS2 = performance.now() / 1000;
  if (nowS2 < flashUntil) {
    ctx.fillStyle = `rgba(255,255,255,${(flashUntil - nowS2) / 0.28 * 0.85})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
  // pomodoro badge
  if (pomoState && pomoState.mode && pomoState.mode !== 'idle') {
    const mm = Math.max(0, pomoState.remaining);
    const label = (pomoState.mode === 'focus' ? '🍅 ' : '☕ ') + fmtRemaining(mm);
    badge.textContent = label;
    badge.style.display = 'block';
    clampBox(badge, p.x - 30 - O.x, p.y - 150 * S.size - 46 - O.y);   // v3.8: clamp inside region
  } else badge.style.display = 'none';
}

function fmtRemaining(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

init();

// test instrumentation (harmless in production)
window.__catBooted = true;
xlog('cat', `renderer alive — breed ${S.breed}, size ${S.size}, pid window ready`);
window.__pose = () => brain ? JSON.parse(JSON.stringify(brain.pose)) : null;
window.__doAction = act => doAction(act);
window.__brain = () => brain;
window.__setPlatforms = list => { if (brain) brain.setPlatforms(list); };
window.__catLocal = () => {
  const p = brain ? brain.pose : { x: O.x, y: O.y };
  return { x: p.x - O.x, y: p.y - O.y };
};
window.__region = () => ({ ...O, w: REGION.w, h: REGION.h });
window.__spawnLaser = () => spawnLaser();
window.__laser = () => laser && { x: laser.x, y: laser.y };
window.__setLaser = (x, y) => { if (laser) { laser.x = x; laser.y = y; if (brain) brain.moveLaser(x, y); } };
window.__spawnButterfly = () => spawnButterfly();
window.__butterfly = () => butterfly && { x: butterfly.x, y: butterfly.y, hue: butterfly.hue };
// v3.13 e2e hooks: full butterfly state + deterministic placement
window.__bfly = () => butterfly && { x: butterfly.x, y: butterfly.y, state: butterfly.state, vx: butterfly.vx };
window.__setButterfly = (x, y) => { if (butterfly) { butterfly.x = x; butterfly.y = y; } return butterfly ? { x: butterfly.x, y: butterfly.y, state: butterfly.state } : null; };
window.__bflyHuntState = () => ({ hunting: !!(brain && brain.stalk && brain.stalk.kind === 'butterfly'), attempts: bflyAttempts, caughtPending: bflyCaughtPending });
window.__dragState = () => ({ dragging, mainDragActive, downOnCat, dragMoved, hasPendingPet: !!pendingPet, overCat });
window.__stopButterfly = () => { clearTimeout(butterflyTimer); butterflyTimer = null; return true; };   // e2e: pin spawns to manual (deterministic suites)
window.__pinButterfly = (x, y) => { bflyPin = (Number.isFinite(x) && Number.isFinite(y)) ? { x, y } : null; return !!bflyPin; };
// ---------------- v3.6 test hooks ----------------
window.__setBattery = (level, charging) => { battery = { level, charging, source: 'test' }; };
window.__battery = () => battery;
window.__pollBattery = () => pollBattery();
window.__setCursor = (x, y) => { lastCursor = { x, y }; };
window.__companion = () => companion && { x: companion.brain.x, state: companion.brain.state };
window.__companionBrain = () => companion && companion.brain;
window.__forceCompanionCd = v => { companionCd = v; };
window.__partyCats = () => partyCats && partyCats.length;
window.__hat = () => currentHat;
window.__perks = () => perks;
window.__setPerks = p => { perks = { ...perks, ...p }; };
window.__photoMode = () => photoMode();
window.__frozen = () => frozen;
window.__settings = () => S;
window.__catVisible = () => catVisible;
window.__lastPlayInfo = () => window.__lastPlay || null;
window.__playMeow = () => playMeow(0.95);   // v3.8 e2e: exercise the classic voice
window.__playMeowSingle = () => playMeowSingle(0.95);   // v3.11 e2e: the single-click voice
window.__fireAmbientMeow = () => fireAmbientMeow();     // v3.11 e2e: ambient meow burst
window.__ambientPending = () => !!ambientMeowTimer;     // v3.11 e2e: scheduler armed
window.__meowBusy = () => meowBusy();                   // v3.12 e2e: user-voice busy flag
window.__mainDragActive = () => mainDragActive && dragging;   // v3.12 e2e
window.__hops = window.__hops || 0;                     // v3.12 e2e: lane-hop counter
window.__trackedPlatId = () => trackedPlatId;   // v3.9 e2e: current tracker target
window.__activeMeowCount = () => (window.__meowEls ? window.__meowEls.size : 0);
window.__clampBox = (el, x, y) => clampBox(el, x, y);
// e2e: dispatch a main-process event through the real handlers
window.__testEvent = (channel, data) => {
  const map = {
    'system-event': onSystemEvent, 'music': onMusic, 'typing': onTyping,
    'cursor-idle': onCursorIdle, 'cursor-busy': onCursorBusy,
    'new-window': onNewWindow, 'app-focus': onAppFocus,
    'pomodoro': onPomodoro, 'achievement': showAchievement,
    'no-walk-zones': zones => {
      if (!brain) return;
      if (S.noWalkZones === false) { brain.setNoWalkZones([]); return; }
      brain.setNoWalkZones(zonesToScreen(zones, brain.bounds));
    },
    'photo-mode': () => photoMode(), 'dance-party': startDanceParty,
    'reminder-fired': showReminder,
    'platform-rect': r => { if (brain) brain.updateTrackedPlatform(r); },   // v3.9 e2e
    'time-bias': mode => { if (!S.timeOfDayMood) return; brain?.setTimeBias(mode); },
    'boot-greet': () => brain?.greet(),
  };
  const fn = map[channel];
  if (fn) { fn(data); return true; }
  return false;
};
</script>
</body>
</html>
